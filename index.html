        <script>
function goToXY() {
    // Ambil nilai dari kotak input
    var input = document.getElementById('xy-coord').value;
    
    // Pisahkan berdasarkan koma (X dan Y)
    var coords = input.split(',');
    if(coords.length !== 2) {
        alert("Format salah! Gunakan format: X, Y (Contoh: 106.8, -6.2)");
        return;
    }

    var x = parseFloat(coords[0].trim());
    var y = parseFloat(coords[1].trim());

    // Cek apakah objek 'map' dari OpenLayers tersedia
    if (typeof map !== 'undefined') {
        // Ubah koordinat derajat (Lon/Lat) ke format peta web
        var point = ol.proj.fromLonLat([x, y]);
        
        // Terbangkan peta ke koordinat tersebut
        map.getView().animate({
            center: point,
            zoom: 16, 
            duration: 1500 // Animasi meluncur selama 1.5 detik
        });
    } else {
        alert("Objek peta tidak ditemukan.");
    }
}
</script>
